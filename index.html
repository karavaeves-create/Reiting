<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>Рейтинг вожатых</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#101827;--card:#1b2638;--muted:#9eacc2;--line:#2c3a50;--accent:#78e0c1;--gold:#ffd36a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:15px/1.45 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:18px 14px 40px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em}h1{font-size:27px;margin:5px 0 8px}.sub,.small,.unit,.foot{color:var(--muted)}.top{display:flex;justify-content:space-between;align-items:center}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 10px;color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat,.panel,.person{background:var(--card);border:1px solid var(--line);border-radius:16px}.stat{padding:12px}.stat strong{font-size:23px;display:block}.stat span{font-size:12px;color:var(--muted)}.panel{padding:14px}.search{width:100%;background:#111c2b;border:1px solid var(--line);color:white;border-radius:12px;padding:12px;font:inherit}.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tab,button{border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}.tab,.actions button{background:#2b3b52;color:white}.tab.active,.actions .plus{background:var(--accent);color:#10221e}.person{padding:12px;display:flex;align-items:center;gap:10px;margin:8px 0}.rank{width:28px;text-align:center;color:var(--gold);font-weight:900}.name{flex:1;font-weight:700}.score{font-size:20px;font-weight:900;text-align:right}.unit{font-size:11px}.winner{border-color:#7c6937}.hidden{display:none!important}.notice{background:#25354a;padding:12px;border-radius:12px;margin:12px 0}.err{color:#ffb2bb}.history-row{border-bottom:1px solid var(--line);padding:10px 0}.delta{color:var(--accent);font-weight:900}.neg{color:#ff9eaa}.foot{text-align:center;font-size:11px;margin-top:22px}
</style></head><body><main><div class="top"><div><div class="eyebrow">ОБЩИЙ РЕЙТИНГ</div><h1>Вожатые ★</h1></div><span class="pill" id="role">Подключение…</span></div><p class="sub">Баллы активности · обновление в реальном времени</p><div id="msg" class="notice hidden"></div><div class="stats"><div class="stat"><strong id="count">—</strong><span>вожатых</span></div><div class="stat"><strong id="sum">—</strong><span>баллов всего</span></div><div class="stat"><strong id="leaders">—</strong><span>с 3+ баллами</span></div></div><div class="panel"><input id="search" class="search" placeholder="Поиск по имени…"><div class="tabs"><button class="tab active" data-view="rating">Рейтинг</button><button class="tab" data-view="history">История</button></div><div id="rating"></div><div id="history" class="hidden"></div></div><div class="foot">Данные общие для всех участников</div></main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||"";let db={counselors:[],history:[]},isAdmin=false,view="rating";const $=x=>document.getElementById(x);
function msg(s,err=false){$("msg").textContent=s;$("msg").classList.remove("hidden");$("msg").classList.toggle("err",err)}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json","Authorization":"tma "+initData,...opt.headers}});const d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка");return d}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let sorted=[...db.counselors].sort((a,b)=>a.name.localeCompare(b.name,"ru")),q=$("search").value.toLocaleLowerCase("ru");$("count").textContent=db.counselors.length;$("sum").textContent=db.counselors.reduce((s,p)=>s+p.score,0);$("leaders").textContent=db.counselors.filter(p=>p.score>=3).length;
if(view==="rating"){$("rating").classList.remove("hidden");$("history").classList.add("hidden");let rank=[...db.counselors].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,"ru")),pos=new Map(rank.map((p,i)=>[p.id,i+1]));$("rating").innerHTML=sorted.filter(p=>p.name.toLocaleLowerCase("ru").includes(q)).map(p=>`<div class="person ${pos.get(p.id)<=3&&p.score>0?"winner":""}"><div class="rank">${p.score?({"1":"🥇","2":"🥈","3":"🥉"}[pos.get(p.id)]||pos.get(p.id)):"—"}</div><div class="name">${esc(p.name)}${isAdmin?`<div class="actions"><button class="plus" data-id="${p.id}" data-d="1">+1</button><button class="plus" data-id="${p.id}" data-d="2">+2</button><button class="plus" data-id="${p.id}" data-d="3">+3</button>${p.score?`<button data-id="${p.id}" data-d="-1">−1</button>`:""}</div>`:""}</div><div><div class="score">${p.score}</div><span class="unit">баллов</span></div></div>`).join("")||"Ничего не найдено"}else{$("rating").classList.add("hidden");$("history").classList.remove("hidden");$("history").innerHTML=db.history.filter(h=>(h.counselorName+" "+h.by+" "+h.note).toLowerCase().includes(q)).map(h=>`<div class="history-row"><b>${esc(h.counselorName)}</b> <span class="delta ${h.delta<0?"neg":""}">${h.delta>0?"+":""}${h.delta}</span><div class="small">${new Date(h.at).toLocaleString("ru-RU")} · ${esc(h.by)} ${h.note?"· "+esc(h.note):""}</div></div>`).join("")||"Записей пока нет"}}
$("rating").onclick=async e=>{let b=e.target.closest("button[data-id]");if(!b)return;let note=prompt("За что начисляем баллы? (необязательно)","");if(note===null)return;try{await api("/api/score",{method:"POST",body:JSON.stringify({counselorId:b.dataset.id,delta:+b.dataset.d,note})})}catch(e){msg(e.message,true)}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});$("search").oninput=render;
async function start(){if(!initData){msg("Открой приложение через Telegram-бота, а не в обычном браузере.",true);$("role").textContent="Нет Telegram";return}try{let c=await api("/api/config");isAdmin=c.isAdmin;$("role").textContent=isAdmin?"Организатор":"Только просмотр";db=await api("/api/state");render();let r=await fetch("/api/events",{headers:{Authorization:"tma "+initData}});if(!r.ok)throw Error("Не удалось подключить синхронизацию");let reader=r.body.getReader(),decoder=new TextDecoder(),buf="";while(true){let {value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});let parts=buf.split("\n\n");buf=parts.pop();for(let part of parts){let line=part.split("\n").find(x=>x.startsWith("data: "));if(line){try{db=JSON.parse(line.slice(6));render()}catch{}}}}}catch(e){msg(e.message,true);$("role").textContent="Ошибка"}}start();
</script></body></html>
